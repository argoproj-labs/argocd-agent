{{- if and .Values.rbac.create .Values.rbac.createClusterRole .Values.rbac.extraClusterRules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argocd-agent-agent.extraClusterRoleName" . }}
  labels:
    {{- include "argocd-agent-agent.labels" . | nindent 4 }}
rules:
{{- toYaml .Values.rbac.extraClusterRules | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "argocd-agent-agent.extraClusterRoleBindingName" . }}
  labels:
    {{- include "argocd-agent-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argocd-agent-agent.extraClusterRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "argocd-agent-agent.serviceAccountName" . }}
  namespace: {{ include "argocd-agent-agent.namespace" . }}
{{- end }}
