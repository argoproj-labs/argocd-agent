{{- if and .Values.rbac.create .Values.rbac.extraRules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argocd-agent-agent.extraRoleName" . }}
  namespace: {{ include "argocd-agent-agent.namespace" . }}
  labels:
    {{- include "argocd-agent-agent.labels" . | nindent 4 }}
rules:
{{- toYaml .Values.rbac.extraRules | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argocd-agent-agent.extraRoleBindingName" . }}
  namespace: {{ include "argocd-agent-agent.namespace" . }}
  labels:
    {{- include "argocd-agent-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "argocd-agent-agent.extraRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "argocd-agent-agent.serviceAccountName" . }}
  namespace: {{ include "argocd-agent-agent.namespace" . }}
{{- end }}
