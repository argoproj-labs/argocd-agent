{{- if and .Values.rbac.create .Values.rbac.createClusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argocd-agent-agent.clusterRoleName" . }}
  labels:
    {{- include "argocd-agent-agent.labels" . | nindent 4 }}
{{- $defaults := include "argocd-agent-agent.defaultClusterRoleRules" . | fromYamlArray }}
{{- $extras := default (list) .Values.rbac.extraClusterRules }}
rules:
{{- include "argocd-agent-agent.mergeRules" (list $defaults $extras) | nindent 0 }}
{{- end }}
