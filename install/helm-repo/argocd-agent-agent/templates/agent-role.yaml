{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argocd-agent-agent.roleName" . }}
  namespace: {{ include "argocd-agent-agent.namespace" . }}
  labels:
    {{- include "argocd-agent-agent.labels" . | nindent 4 }}
{{- $defaults := include "argocd-agent-agent.defaultRoleRules" . | fromYamlArray }}
{{- $extras := default (list) .Values.rbac.extraRules }}
rules:
{{- include "argocd-agent-agent.mergeRules" (list $defaults $extras) | nindent 0 }}
{{- end }}
