apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-agent-redis-proxy
  labels:
    app.kubernetes.io/name: argocd-agent-principal
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-agent-principal
      app.kubernetes.io/component: principal
  policyTypes:
  - Ingress
  ingress:
  # Allow Redis proxy port (6379) only from Argo CD, and only from this
  # namespace. Select by app.kubernetes.io/name: the plain manifests set only
  # that label on pods (part-of lives on the Deployment), and the Helm chart
  # sets part-of on every Argo CD pod, so part-of is either absent or too
  # broad. This matches the client set in Argo CD's own
  # argocd-redis-network-policy. Omitting namespaceSelector restricts the rule
  # to the principal's own namespace.
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-repo-server
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-application-controller
    ports:
    - protocol: TCP
      port: 6379
  # Allow resource proxy port (9090) only from the Argo CD server, and only
  # from this namespace. The server is the sole supported client: it proxies
  # live resource requests to the agents. The hub's application controller is
  # absent in managed and autonomous mode, and in hybrid mode agent cluster
  # secrets carry argocd.argoproj.io/skip-reconcile so it does not reach
  # agent clusters at all.
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
    ports:
    - protocol: TCP
      port: 9090
  # Allow principal gRPC port (8443) from agents
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: argocd-agent
          app.kubernetes.io/component: agent
    ports:
    - protocol: TCP
      port: 8443
  # Allow metrics and healthz from monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8000  # metrics
    - protocol: TCP
      port: 8003  # healthz
