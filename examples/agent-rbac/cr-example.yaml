apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-agent-cr-examples
rules:
  # Example: For applications using cert-manager
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - issuers
      - clusterissuers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Example: For applications using Istio
  - apiGroups:
      - networking.istio.io
    resources:
      - virtualservices
      - destinationrules
      - gateways
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Example: For applications using monitoring stack
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - prometheusrules
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
